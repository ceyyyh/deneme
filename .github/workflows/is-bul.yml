# İşBul İstanbul: ilanları birkaç saatte bir tarar, is_bul/site/jobs.json'u
# güncelleyip repoya kaydeder ve siteyi GitHub Pages'e yayınlar.
name: İşBul İstanbul - ilan güncelle

on:
  schedule:
    - cron: "23 */3 * * *"   # 3 saatte bir (UTC); bir tur ~5-10 dk sürer
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [claude/ai-job-search-repo-rkuvtt]   # Pages yalnız varsayılan daldan yayınlanabilir
    paths:
      - "is_bul/site/index.html"
      - "is_bul/site/app.js"
      - "is_bul/site/style.css"
      - "is_bul/scrape.py"
      - "is_bul/geo.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: is-bul
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: python -m pip install -r is_bul/requirements.txt

      - name: İlanları tara
        run: python is_bul/scrape.py

      - name: jobs.json'u repoya kaydet
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name "isbul-bot"
          git config user.email "isbul-bot@users.noreply.github.com"
          git add is_bul/site/jobs.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "İşBul: ilanlar güncellendi ($(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M'))"
            remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase --autostash "$remote" "${GITHUB_REF_NAME}"
            git push "$remote" "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: is_bul/site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
